<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculat0r</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <h2>Znam sta ste radili proslog leta</h2>

        <div class="app-container">
            <div class="expression-screen">
                <input type="text" placeholder="enter expression here :">
               
            </div>
            <div class="buttons">
                <button class="operation">(</button>
                <button class="operation">)</button>
                <button class="operation">%</button>
                <button class="clear-input">AC</button>
                <button class="numbers">7</button>
                <button class="numbers">8</button>
                <button class="numbers">9</button>
                <button class="operation">/</button>
                <button class="numbers">4</button>
                <button class="numbers">5</button>
                <button class="numbers">6</button>
                <button class="operation">x</button>
                <button class="numbers">1</button>
                <button class="numbers">2</button>
                <button class="numbers">3</button>
                <button class="operation">-</button>
                <button class="operation">.</button>
                <button class="numbers">0</button>
                <button class="operation">=</button>
                <button class="operation">+</button>
                
            </div>
        </div>
        <p class="result">p</p>


        <script src="javascript.js"></script>
    </body>

</html>
